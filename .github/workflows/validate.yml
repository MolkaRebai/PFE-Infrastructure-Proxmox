name: Validate

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # Job 1 : Validation Terraform VM
  validate-terraform-vm:
    name: Validate Terraform VM
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharger le code depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "0.66"

      # 3. Initialiser Terraform (sans backend)
      - name: Terraform Init VM
        run: terraform init -backend=false
        working-directory: terraform-vm
      

      # 4. Vérifier le formatage du code
      - name: Terraform Format Check VM
        run: terraform fmt -check -recursive
        working-directory: terraform-vm
        
      # 5. Valider la syntaxe HCL
      - name: Terraform Validate VM
        run: terraform validate
        working-directory: terraform-vm
        

  # ── Job 2 : Validation Terraform LXC ────────────────────
  validate-terraform-lxc:
    name: Validate Terraform LXC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "0.66"

      - name: Terraform Init LXC
        run: terraform init -backend=false
        working-directory: terraform-lxc

      - name: Terraform Format Check LXC
        run: terraform fmt -check -recursive
        working-directory: terraform-lxc

      - name: Terraform Validate LXC
        run: terraform validate
        working-directory: terraform-lxc

  # ── Job 3 : Validation Ansible ───────────────────────────
  validate-ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installer Python + Ansible + ansible-lint
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and Lint
        run: |
          pip install ansible ansible-lint
          # ansible      = outil de configuration
          # ansible-lint = vérifie les bonnes pratiques
          # Exemple de règles vérifiées :
          # - Pas de mot de passe en clair
          # - Tâches avec un nom (name:)
          # - Modules à jour (pas dépréciés)

      # Vérifier la syntaxe des playbooks
      - name: Ansible Syntax Check
        run: |
          for playbook in ansible/playbooks/*.yml; do
            echo "Checking $playbook..."
            ansible-playbook --syntax-check \
              -i ansible/inventory/ \
              "$playbook"
          done
        

      # Linter Ansible
      - name: Ansible Lint
        run: ansible-lint ansible/playbooks/
        continue-on-error: true

  #Job 4 : Résumé final
  validate-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      - validate-terraform-vm
      - validate-terraform-lxc
      - validate-ansible

    steps:
      - name: Summary
        run: |
          echo "================================"
          echo " Terraform VM     : Valid"
          echo " Terraform LXC    : Valid"
          echo " Ansible Playbooks: Valid"
          echo "================================"
          echo "Code is ready for deployment!"