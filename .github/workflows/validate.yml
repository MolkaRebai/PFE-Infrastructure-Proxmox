name: Validate

# MODE TEST : ce fichier est 100% safe
# terraform fmt/validate et ansible --syntax-check
# ne touchent RIEN a l'infrastructure

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
  # Permet de lancer manuellement depuis GitHub Actions
  workflow_dispatch:

jobs:
  validate-terraform-vm:
    name: Validate Terraform VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      # -backend=false = pas de connexion au backend Terraform
      # pas besoin de credentials Proxmox pour valider
      - name: Terraform Init VM
        run: terraform init -backend=false
        working-directory: terraform-vm

      - name: Terraform Format Check VM
        run: terraform fmt -check -recursive
        working-directory: terraform-vm

      - name: Terraform Validate VM
        run: terraform validate
        working-directory: terraform-vm

  validate-terraform-lxc:
    name: Validate Terraform LXC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init LXC
        run: terraform init -backend=false
        working-directory: terraform-lxc

      - name: Terraform Format Check LXC
        run: terraform fmt -check -recursive
        working-directory: terraform-lxc

      - name: Terraform Validate LXC
        run: terraform validate
        working-directory: terraform-lxc

  validate-ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and Lint
        run: pip install ansible ansible-lint

      # --syntax-check = verifie uniquement la syntaxe YAML/Ansible
      # n'execute aucune tache sur les VMs
      - name: Ansible Syntax Check
        run: |
          for playbook in ansible/playbooks/*.yml; do
            echo "Checking $playbook..."
            ansible-playbook --syntax-check \
              -i ansible/inventory/ \
              "$playbook"
          done

      - name: Ansible Lint
        run: ansible-lint ansible/playbooks/
        continue-on-error: true

  validate-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      - validate-terraform-vm
      - validate-terraform-lxc
      - validate-ansible

    steps:
      - name: Summary
        run: |
          echo "================================"
          echo " Terraform VM     : ${{ needs.validate-terraform-vm.result }}"
          echo " Terraform LXC    : ${{ needs.validate-terraform-lxc.result }}"
          echo " Ansible Playbooks: ${{ needs.validate-ansible.result }}"
          echo "================================"
          echo "Code is ready for deployment!"
