# deploy.yml
# Plan + Apply Terraform pour VMs et LXC
name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Variables d'environnement disponibles pour tous les jobs
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_proxmox_url: "https://${{ secrets.PROXMOX_HOST }}:8006"
  TF_VAR_proxmox_node: ${{ secrets.PROXMOX_NODE }}

jobs:
  # ── Job 1 : Terraform Plan VM ────────────────────────────
  plan-vm:
    name: Plan Terraform VM
    runs-on: self-hosted
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node.js
        run: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        node --version

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3



      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init VM
        run: terraform init
        working-directory: terraform-vm

      - name: Terraform Plan VM
        run: terraform plan -out=tfplan-vm -no-color | Tee-Object -FilePath plan-output-vm.txt
        working-directory: terraform-vm
          # -out=tfplan-vm   = sauvegarde le plan
          # -no-color        = pas de couleurs ANSI
          # tee              = affiche ET sauvegarde

      # Poster le plan en commentaire sur la PR
      - name: Comment PR with VM Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              'terraform-vm/plan-output-vm.txt', 
              'utf8'
            );
            // Limiter à 65000 caractères (limite GitHub)
            const truncated = plan.length > 65000 
              ? plan.substring(0, 65000) + '\n... (truncated)'
              : plan;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🖥️ Terraform Plan - VMs\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ── Job 2 : Terraform Plan LXC ───────────────────────────
  plan-lxc:
    name: Plan Terraform LXC
    runs-on: self-hosted
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init LXC
        run: terraform init
        working-directory: terraform-lxc

      - name: Terraform Plan LXC
        run: terraform plan -out=tfplan-lxc -no-color | Tee-Object -FilePath plan-output-lxc.txt
        working-directory: terraform-lxc

      - name: Comment PR with LXC Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              'terraform-lxc/plan-output-lxc.txt',
              'utf8'
            );
            const truncated = plan.length > 65000
              ? plan.substring(0, 65000) + '\n... (truncated)'
              : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Terraform Plan - LXC\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ── Job 3 : Apply VM ─────────────────────────────────────
  apply-vm:
    name: Apply Terraform VM
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # S'exécute UNIQUEMENT sur push dans main
    # = après merge d'une PR approuvée
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init VM
        run: terraform init
        working-directory: terraform-vm

      - name: Terraform Apply VM
        run: terraform apply  -no-color
        working-directory: terraform-vm
        

      # Sauvegarder l'inventory généré par Terraform
      - name: Upload Ansible Inventory
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/inventory.ini
          
  # ── Job 4 : Apply LXC ────────────────────────────────────
  apply-lxc:
    name: Apply Terraform LXC
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    needs: apply-vm
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init LXC
        run: terraform init
        working-directory: terraform-lxc

      - name: Terraform Apply LXC
        run: terraform apply -auto-approve
        working-directory: terraform-lxc
