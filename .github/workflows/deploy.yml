# deploy.yml
name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_proxmox_url: "https://${{ secrets.PROXMOX_HOST }}:8006"
  TF_VAR_proxmox_node: ${{ secrets.PROXMOX_NODE }}

jobs:
  plan-vm:
    name: Plan Terraform VM
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init VM
        run: terraform init
        working-directory: terraform-vm

      - name: Terraform Plan VM
        run: terraform plan -out=tfplan-vm -no-color 2>&1 | tee plan-output-vm.txt
        working-directory: terraform-vm

      - name: Comment PR with VM Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform-vm/plan-output-vm.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.substring(0, 65000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - VMs\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  plan-lxc:
    name: Plan Terraform LXC
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init LXC
        run: terraform init
        working-directory: terraform-lxc

      - name: Terraform Plan LXC
        run: terraform plan -out=tfplan-lxc -no-color 2>&1 | tee plan-output-lxc.txt
        working-directory: terraform-lxc

      - name: Comment PR with LXC Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform-lxc/plan-output-lxc.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.substring(0, 65000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - LXC\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  apply-vm:
    name: Apply Terraform VM
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init VM
        run: terraform init
        working-directory: terraform-vm

      - name: Terraform Apply VM
        run: terraform apply -auto-approve -no-color
        working-directory: terraform-vm

      - name: Upload Ansible Inventory
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/inventory.ini

  apply-lxc:
    name: Apply Terraform LXC
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    needs: apply-vm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init LXC
        run: terraform init
        working-directory: terraform-lxc

      - name: Terraform Apply LXC
        run: terraform apply -auto-approve -no-color
        working-directory: terraform-lxc
