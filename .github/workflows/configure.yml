name: Configure Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target hosts (all, linux, windows)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  configure-linux:
    name: Configure Ubuntu Servers
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Test Connectivity
        continue-on-error: true
        run: |
          ansible all \
            -i ansible/inventory/ \
            -m ping \
            --limit all_machines

      - name: Configure Common (dry-run)
        continue-on-error: true
        run: |
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_common.yml \
            --limit all_machines \
            --check \
            -v

      - name: Configure Services (dry-run)
        continue-on-error: true
        run: |
          ansible-playbook -i ansible/inventory/ ansible/playbooks/setup_lxc_dns.yml --check -v
          ansible-playbook -i ansible/inventory/ ansible/playbooks/setup_lxc_nfs.yml --check -v
          ansible-playbook -i ansible/inventory/ ansible/playbooks/setup_vm_web.yml --check -v
          ansible-playbook -i ansible/inventory/ ansible/playbooks/setup_vm_db.yml --check -v
          ansible-playbook -i ansible/inventory/ ansible/playbooks/setup_lxc_app.yml --check -v

      - name: Install Zabbix Agents (dry-run)
        continue-on-error: true
        run: |
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_zabbix_agents.yml \
            --limit all_machines \
            --check \
            -v