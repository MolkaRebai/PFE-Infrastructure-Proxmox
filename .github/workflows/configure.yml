name: Configure Infrastructure

on:
  # Déclenché automatiquement après deploy.yml
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target hosts (all, linux, windows)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  # ── Job 1 : Configure Ubuntu Server ─────────────────────
  configure-linux:
    name: Configure Ubuntu Servers
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer la clé SSH
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      # Tester la connectivité avant de configurer
      - name: Test Connectivity
        continue-on-error: true
        run: |
          ansible all \
            -i ansible/inventory/ \
            -m ping \
            --limit all_machines

      # Configurer les services communs (dry-run)
      - name: Configure Common (dry-run)
        continue-on-error: true
        run: |
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_common.yml \
            --limit all_machines \
            --check \
            -v

      # Configurer les services spécifiques (dry-run)
      - name: Configure Services (dry-run)
        continue-on-error: true
        run: |
          # DNS
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_lxc_dns.yml \
            --check \
            -v

          # NFS
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_lxc_nfs.yml \
            --check \
            -v

          # Web
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_vm_web.yml \
            --check \
            -v

          # Database
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_vm_db.yml \
            --check \
            -v

          # App
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_lxc_app.yml \
            --check \
            -v

      # Installer les agents Zabbix (dry-run)
      - name: Install Zabbix Agents (dry-run)
        continue-on-error: true
        run: |
          ansible-playbook \
            -i ansible/inventory/ \
            ansible/playbooks/setup_zabbix_agents.yml \
            --limit all_machines \
            --check \
            -v