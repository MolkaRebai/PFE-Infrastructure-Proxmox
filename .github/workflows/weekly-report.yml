name: Weekly Infrastructure Report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    name: Generate Weekly Report
    runs-on: self-hosted

    env:
      ZABBIX_URL:      "http://172.19.14.52/zabbix"
      ZABBIX_USER:     "Admin"
      ZABBIX_PASSWORD: ${{ secrets.MDP_ZABBIX }}
      PROXMOX_HOST:    ${{ secrets.PROXMOX_HOST }}
      PROXMOX_TOKEN:   ${{ secrets.PROXMOX_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install requests jinja2

      - name: Generate Report
        run: |
          cat > /tmp/weekly_report.py << 'PYTHON'
          import requests
          import json
          import os
          from datetime import datetime, timedelta

          ZABBIX_URL      = os.environ.get("ZABBIX_URL")
          ZABBIX_USER     = os.environ.get("ZABBIX_USER")
          ZABBIX_PASSWORD = os.environ.get("ZABBIX_PASSWORD")
          PROXMOX_HOST    = os.environ.get("PROXMOX_HOST")
          PROXMOX_TOKEN   = os.environ.get("PROXMOX_TOKEN")

          missing = [k for k, v in {
              "ZABBIX_URL"     : ZABBIX_URL,
              "ZABBIX_USER"    : ZABBIX_USER,
              "ZABBIX_PASSWORD": ZABBIX_PASSWORD,
              "PROXMOX_HOST"   : PROXMOX_HOST,
              "PROXMOX_TOKEN"  : PROXMOX_TOKEN,
          }.items() if not v]

          if missing:
              print(f"Variables manquantes : {missing}")
              exit(1)

          def zabbix_login():
              r = requests.post(f"{ZABBIX_URL}/api_jsonrpc.php", json={
                  "jsonrpc": "2.0",
                  "method" : "user.login",
                  "params" : {
                      "username": ZABBIX_USER,
                      "password": ZABBIX_PASSWORD
                  },
                  "id": 1
              })
              return r.json()["result"]

          def get_proxmox_status():
              headers = {
                  "Authorization": f"PVEAPIToken={PROXMOX_TOKEN}"
              }
              r = requests.get(
                  f"https://{PROXMOX_HOST}:8006/api2/json/nodes",
                  headers=headers,
                  verify=False
              )
              return r.json()["data"]

          def get_weekly_problems(token):
              time_from = int(
                  (datetime.now() - timedelta(days=7)).timestamp()
              )
              r = requests.post(f"{ZABBIX_URL}/api_jsonrpc.php", json={
                  "jsonrpc": "2.0",
                  "method" : "problem.get",
                  "params" : {
                      "output"   : "extend",
                      "time_from": time_from,
                      "recent"   : False,
                      "sortfield": ["eventid"],
                      "sortorder": "DESC",
                      "limit"    : 50
                  },
                  "auth": token,
                  "id"  : 5
              })
              return r.json().get("result", [])

          def get_vms_status(token):
              r = requests.post(f"{ZABBIX_URL}/api_jsonrpc.php", json={
                  "jsonrpc": "2.0",
                  "method" : "host.get",
                  "params" : {
                      "output"          : ["host", "name", "available"],
                      "selectInterfaces": ["ip"],
                      "filter"          : {"status": 0}
                  },
                  "auth": token,
                  "id"  : 6
              })
              return r.json().get("result", [])

          def get_host_metrics(token, hostid):
              keys = [
                  "system.cpu.util",
                  "vm.memory.util",
              ]
              r = requests.post(f"{ZABBIX_URL}/api_jsonrpc.php", json={
                  "jsonrpc": "2.0",
                  "method" : "item.get",
                  "params" : {
                      "output" : ["key_", "lastvalue"],
                      "hostids": hostid,
                      "filter" : {"key_": keys}
                  },
                  "auth": token,
                  "id"  : 7
              })
              items  = r.json().get("result", [])
              cpu, ram = 0, 0
              for item in items:
                  val = float(item["lastvalue"] or 0)
                  if "cpu"    in item["key_"]: cpu = round(val, 1)
                  if "memory" in item["key_"]: ram = round(val, 1)
              return cpu, ram

          print("Connecting to Zabbix...")
          token = zabbix_login()

          print("Getting Proxmox status...")
          proxmox = get_proxmox_status()

          print("Getting weekly problems...")
          problems = get_weekly_problems(token)

          print("Getting VMs status...")
          vms = get_vms_status(token)

          available   = sum(1 for v in vms if v["available"] == "1")
          unavailable = sum(1 for v in vms if v["available"] == "0")
          total_vms   = len(vms)

          now        = datetime.now().strftime('%d/%m/%Y')
          week_start = (datetime.now() - timedelta(days=7)).strftime('%d/%m/%Y')

          proxmox_rows = ""
          for node in proxmox:
              cpu_pct  = round(node.get('cpu', 0) * 100, 1)
              mem_used = round(node.get('mem', 0) / 1024**3, 1)
              mem_max  = round(node.get('maxmem', 0) / 1024**3, 1)
              mem_pct  = round(mem_used / mem_max * 100, 1) if mem_max > 0 else 0
              uptime   = round(node.get('uptime', 0) / 3600 / 24, 1)
              status   = node['status']
              cpu_color  = "#e74c3c" if cpu_pct > 80 else "#f39c12" if cpu_pct > 60 else "#27ae60"
              mem_color  = "#e74c3c" if mem_pct > 85 else "#f39c12" if mem_pct > 70 else "#27ae60"
              stat_color = "#27ae60" if status == "online" else "#e74c3c"
              proxmox_rows += f"""
              <tr>
                <td>{node['node']}</td>
                <td style="color:{stat_color}; font-weight:bold">{status.upper()}</td>
                <td>
                  <div class="bar-bg">
                    <div class="bar-fill" style="width:{cpu_pct}%; background:{cpu_color}"></div>
                  </div>
                  <span>{cpu_pct}%</span>
                </td>
                <td>
                  <div class="bar-bg">
                    <div class="bar-fill" style="width:{mem_pct}%; background:{mem_color}"></div>
                  </div>
                  <span>{mem_used}GB / {mem_max}GB ({mem_pct}%)</span>
                </td>
                <td>{uptime} jours</td>
              </tr>
              """

          vm_rows = ""
          for vm in vms:
              avail      = vm["available"]
              avail_text = "En ligne"    if avail == "1" else "Hors ligne"
              avail_color= "#27ae60"     if avail == "1" else "#e74c3c"
              ip         = vm.get("interfaces", [{}])[0].get("ip", "N/A")
              cpu, ram = get_host_metrics(token, vm["hostid"])
              cpu_color = "#e74c3c" if cpu > 80 else "#f39c12" if cpu > 60 else "#27ae60"
              ram_color = "#e74c3c" if ram > 85 else "#f39c12" if ram > 70 else "#27ae60"
              vm_rows += f"""
              <tr>
                <td>{vm['name']}</td>
                <td>{ip}</td>
                <td style="color:{avail_color}; font-weight:bold">{avail_text}</td>
                <td style="color:{cpu_color}">{cpu}%</td>
                <td style="color:{ram_color}">{ram}%</td>
              </tr>
              """

          problem_rows = ""
          severity_map = {
              "0": ("Non classe",    "#95a5a6"),
              "1": ("Info",          "#3498db"),
              "2": ("Avertissement", "#f39c12"),
              "3": ("Moyen",         "#e67e22"),
              "4": ("Eleve",         "#e74c3c"),
              "5": ("Critique",      "#8e44ad"),
          }
          for p in problems[:10]:
              sev   = p.get("severity", "0")
              label, color = severity_map.get(sev, ("Inconnu", "#95a5a6"))
              ts    = datetime.fromtimestamp(int(p.get("clock", 0))).strftime('%d/%m %H:%M')
              problem_rows += f"""
              <tr>
                <td>{ts}</td>
                <td style="color:{color}; font-weight:bold">{label}</td>
                <td>{p.get('name', 'Inconnu')}</td>
              </tr>
              """

          if not problem_rows:
              problem_rows = """
              <tr>
                <td colspan="3" style="text-align:center; color:#27ae60">
                  Aucun probleme cette semaine
                </td>
              </tr>
              """

          html = f"""<!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Rapport Hebdomadaire Infrastructure</title>
            <style>
              * {{ margin:0; padding:0; box-sizing:border-box; }}
              body {{ font-family: Arial, sans-serif; background: #f0f2f5; color: #2c3e50; }}
              .wrapper {{ max-width: 900px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }}
              .header {{ background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); color: white; padding: 40px; text-align: center; }}
              .header h1 {{ font-size: 28px; margin-bottom: 8px; }}
              .summary {{ display: flex; border-bottom: 1px solid #eee; }}
              .summary-card {{ flex: 1; padding: 25px; text-align: center; border-right: 1px solid #eee; }}
              .summary-card:last-child {{ border-right: none; }}
              .summary-card .number {{ font-size: 36px; font-weight: bold; display: block; }}
              .summary-card .label {{ font-size: 12px; color: #7f8c8d; margin-top: 4px; }}
              .section {{ padding: 30px 40px; border-bottom: 1px solid #eee; }}
              .section h2 {{ font-size: 18px; margin-bottom: 20px; color: #1a1a2e; }}
              table {{ width: 100%; border-collapse: collapse; font-size: 14px; }}
              th {{ background: #f8f9fa; padding: 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #dee2e6; }}
              td {{ padding: 12px; border-bottom: 1px solid #f0f0f0; }}
              .bar-bg {{ background: #ecf0f1; border-radius: 4px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; margin-right: 8px; }}
              .bar-fill {{ height: 100%; border-radius: 4px; }}
              .footer {{ background: #f8f9fa; padding: 20px 40px; text-align: center; font-size: 12px; color: #7f8c8d; }}
            </style>
          </head>
          <body>
            <div class="wrapper">
              <div class="header">
                <h1>Rapport Hebdomadaire Infrastructure</h1>
                <p>Semaine du {week_start} au {now}</p>
              </div>
              <div class="summary">
                <div class="summary-card">
                  <span class="number" style="color:#3498db">{total_vms}</span>
                  <span class="label">VMs Total</span>
                </div>
                <div class="summary-card">
                  <span class="number" style="color:#27ae60">{available}</span>
                  <span class="label">En ligne</span>
                </div>
                <div class="summary-card">
                  <span class="number" style="color:#e74c3c">{unavailable}</span>
                  <span class="label">Hors ligne</span>
                </div>
                <div class="summary-card">
                  <span class="number" style="color:#e67e22">{len(problems)}</span>
                  <span class="label">Problemes</span>
                </div>
              </div>
              <div class="section">
                <h2>Noeuds Proxmox</h2>
                <table>
                  <thead><tr><th>Noeud</th><th>Statut</th><th>CPU</th><th>Memoire</th><th>Uptime</th></tr></thead>
                  <tbody>{proxmox_rows}</tbody>
                </table>
              </div>
              <div class="section">
                <h2>Machines Virtuelles</h2>
                <table>
                  <thead><tr><th>Nom</th><th>IP</th><th>Statut</th><th>CPU</th><th>RAM</th></tr></thead>
                  <tbody>{vm_rows}</tbody>
                </table>
              </div>
              <div class="section">
                <h2>Problemes de la semaine (Top 10)</h2>
                <table>
                  <thead><tr><th>Date</th><th>Severite</th><th>Probleme</th></tr></thead>
                  <tbody>{problem_rows}</tbody>
                </table>
              </div>
              <div class="footer">
                Rapport genere automatiquement le {now} via GitHub Actions
              </div>
            </div>
          </body>
          </html>
          """

          with open("/tmp/weekly_report.html", "w") as f:
              f.write(html)

          print("Rapport HTML genere : /tmp/weekly_report.html")
          PYTHON
          python3 /tmp/weekly_report.py

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: /tmp/weekly_report.html
          retention-days: 30

      - name: Send Report by Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          to:             ${{ secrets.MAIL_TO }}
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject:        "Rapport Hebdomadaire Infrastructure - ${{ github.run_number }}"
          html_body:      file:///tmp/weekly_report.html
